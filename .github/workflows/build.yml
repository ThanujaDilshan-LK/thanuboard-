name: Build and Release ThanuBoard APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # මෙතනින් Gradle 8.4 වර්ෂන් එක කෙලින්ම Runner එකට දානවා
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4

    # gradlew නැති නිසා කෙලින්ම global gradle command එකෙන් build කරනවා
    - name: Build with Gradle
      run: gradle assembleDebug --warning-mode all

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThanuBoard-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
